known_gaps:
  - topic: KYC / 实名认证
    note: admin-frontend 中不存在任何 KYC、实名认证相关的页面、路由或接口（已全量检索确认）。
    keywords: [kyc, 实名, 实名认证, 身份认证, 身份验证, 证件审核, identity verification]
  - topic: 工单 / 客服会话
    note: 后台没有工单系统或客服会话入口；与客户的触达手段只有内容管理下的消息管理、邮件管理与站内信管理。
    keywords: [工单, 客服, 客诉, 投诉, 客服会话, ticket]
  - topic: 公告管理
    note: 没有独立的「公告」页面。最接近的是内容管理下的文章管理、站内信管理与消息管理。
    keywords: [公告, 通告, 全站通知, announcement]
  - topic: 风控规则配置
    note: 后台没有风控规则/风控策略的配置页面。风控只有逐笔人工审核入口（出金审核-风控），以及黑名单页上的权限限制开关。
    keywords: [风控规则, 风控策略, 风控配置, 风控模型, risk rule]
  - topic: 单条记录的直达链接
    note: 全站只有 4 条带动态段的路由（代理申请详情、代理结构、佣金配置详情、修改角色），其余页面都没有指向单条记录的 URL。客户详情是 React state 里的抽屉，不写 URL；列表页也不支持 ?user_code= 之类的预填参数。因此除这 4 条外只能给页面级链接，靠 lookup_hint 说明进页面后怎么找。
    keywords: [深链, 直达链接, 记录链接, 详情页链接, deep link]
  - topic: 按当前运营用户的权限过滤
    note: manifest 只携带 menu_key 作为信息，不做权限过滤 —— MCP 下游是一套共享的静态 cookie，拿不到当前运营用户真实的 menu_keys[]。回答里应说明「能否打开取决于你的后台权限」。
    keywords: [权限过滤, 权限校验, 按权限过滤, 有没有权限]
