# 人工维护的导航描述。生成器只搬运这里的字段，不会改写本文件。
#
# 索引键是 pages.yaml 里的 `id`。对绝大多数页面 id 就等于 menu_key；
# 少数与列表页共用 menu_key 的隐藏页（详情/新建/编辑）带一段 `:后缀`，
# 详见 README.md「id 怎么来」。
#
# 本轮只精写运营高频域（finance / customers / orders / agents + 分润结算），
# 外加 settings.users.settings —— 它和客户列表存在「用户」歧义，必须两边都标注。
# 其余页面靠 title 与三语 i18n 标题兜底，生成器会自动补进 keywords。
#
# 所有条目均为按代码信号批量起草，reviewed: false 表示尚未人工逐条复核。

known_gaps:
  - topic: KYC / 实名认证
    note: admin-frontend 中不存在任何 KYC、实名认证相关的页面、路由或接口（已全量检索确认）。
    keywords: [kyc, 实名, 实名认证, 身份认证, 身份验证, 证件审核, identity verification]

  - topic: 工单 / 客服会话
    note: 后台没有工单系统或客服会话入口；与客户的触达手段只有内容管理下的消息管理、邮件管理与站内信管理。
    keywords: [工单, 客服, 客诉, 投诉, 客服会话, ticket]

  - topic: 公告管理
    note: 没有独立的「公告」页面。最接近的是内容管理下的文章管理、站内信管理与消息管理。
    keywords: [公告, 通告, 全站通知, announcement]

  - topic: 风控规则配置
    note: 后台没有风控规则/风控策略的配置页面。风控只有逐笔人工审核入口（出金审核-风控），以及黑名单页上的权限限制开关。
    keywords: [风控规则, 风控策略, 风控配置, 风控模型, risk rule]

  - topic: 单条记录的直达链接
    note: "全站只有 4 条带动态段的路由（代理申请详情、代理结构、佣金配置详情、修改角色），其余页面都没有指向单条记录的 URL。客户详情是 React state 里的抽屉，不写 URL；列表页也不支持 ?user_code= 之类的预填参数。因此除这 4 条外只能给页面级链接，靠 lookup_hint 说明进页面后怎么找。"
    keywords: [深链, 直达链接, 记录链接, 详情页链接, deep link]

  - topic: 按当前运营用户的权限过滤
    note: "manifest 只携带 menu_key 作为信息，不做权限过滤 —— MCP 下游是一套共享的静态 cookie，拿不到当前运营用户真实的 menu_keys[]。回答里应说明「能否打开取决于你的后台权限」。"
    keywords: [权限过滤, 权限校验, 按权限过滤, 有没有权限]

pages:
  # ============ 资金 ============
  finance.cash.deposit:
    description: "查询和筛选客户入金记录，查看到账状态、充值类型、支付通道与金额。"
    keywords:
      - 入金
      - 充值
      - 存款
      - 入金记录
      - 到账
      - deposit
    capabilities:
      - 按 User ID(user_code) 筛选入金记录
      - 按状态/入金状态/充值类型/支付通道筛选
      - 按入金时间(GMT+0)范围筛选
      - 导出入金记录
      - 从记录打开客户详情抽屉
    lookup_hint: "打开入金管理后，在顶部筛选栏填 User ID（user_code）并选择入金时间范围搜索。"
    reviewed: true

  finance.cash.withdrawRisk:
    description: "出金申请的风控审核环节；风控通过后才会流转到财务审核。"
    keywords:
      - 出金
      - 提现
      - 取款
      - 出金审核
      - 风控
      - 风控审核
      - 一审
      - withdraw
    capabilities:
      - 按 user_code 或出金单号(order_no)筛选待风控的出金申请
      - 按状态/出金通道/出金时间筛选
      - 通过或拒绝风控审核
      - 审核确认弹窗中查看该用户的赠金信息
      - 导出风控出金记录
